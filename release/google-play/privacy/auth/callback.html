<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="/i18n.js"></script>
  <meta name="color-scheme" content="dark"><meta name="robots" content="noindex">
  <title>Confirm account · Be Your Eye</title>
  <link rel="stylesheet" href="/account/style.css">
  <link rel="stylesheet" href="/account/i18n.css">
  <script type="module" src="/auth/callback.js"></script>
</head>
<body><main>
  <a class="brand" href="/">Be Your Eye <span>帮你盯</span></a>
  <h1 id="title">Confirming your account…</h1>
  <p id="message" role="status" aria-live="polite">Please wait.</p>
  <section id="recovery-panel" hidden>
    <p id="account-email"></p>
    <form id="recovery-form" method="post">
      <label id="new-password-label" for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
      <label id="confirm-password-label" for="password-again">Confirm password</label>
      <input id="password-again" name="password-again" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
      <p class="small" id="recovery-hint">Use at least 8 characters, including letters and numbers.</p>
      <button id="save-password" type="submit">Save new password</button>
    </form>
  </section>
  <a id="continue" href="/account/">Open account</a>
  <p class="small" id="callback-close-hint">Already finished in the mobile app? You may close this page.</p>
  <noscript><p id="callback-noscript">Enable JavaScript, or reopen the email link in the latest app.</p></noscript>
  <footer><a id="callback-support-link" href="mailto:support@beyoureye.com">Product support</a></footer>
</main></body></html>
