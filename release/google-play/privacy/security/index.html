<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Be Your Eye 安全报告 / Security</title>
  <style>
    :root { color-scheme:dark; --bg:#0d1114; --surface:#151b20; --line:#2b363e; --text:#e8eef1; --muted:#a7b3ba; --cyan:#62cad6; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif; }
    main { width:min(650px,calc(100% - 32px)); padding:30px; border:1px solid var(--line); border-radius:18px; background:var(--surface); }
    h1 { margin-top:0; } p { color:var(--muted); } a { color:var(--cyan); overflow-wrap:anywhere; }
  </style>
</head>
<body>
<!--email_off-->
<main>
  <h1>私密安全报告</h1>
  <p>漏洞、密钥或用户数据问题请发送到下方邮箱。请勿在公开 Issue 中披露敏感信息。</p>
  <h1 lang="en">Private security reports</h1>
  <p lang="en">Report vulnerabilities, exposed secrets, or user-data issues by email. Do not disclose sensitive details in a public issue.</p>
  <a href="mailto:security@beyoureye.com?subject=Be%20Your%20Eye%20security%20report">security@beyoureye.com</a>
</main>
<!--/email_off-->
</body>
</html>
