<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/i18n.js"></script>
  <meta name="color-scheme" content="dark">
  <title>Page not found · Be Your Eye</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1114; --surface:#151b20; --line:#2b363e; --text:#e8eef1; --muted:#a7b3ba; --cyan:#62cad6; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.7 system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif; }
    main { max-width:680px; margin:0 auto; padding:64px 22px; }
    section { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:28px; }
    p { color:var(--muted); } a { color:var(--cyan); }
  </style>
</head>
<body>
<main>
  <section>
    <h1 id="not-found-title">Page not found</h1>
    <p id="not-found-intro">Return to the Be Your Eye home page.</p>
    <a href="/" id="not-found-home">Home</a>
  </section>
</main>
</body>
</html>
